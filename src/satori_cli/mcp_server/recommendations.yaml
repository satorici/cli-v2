# Rules for the `recommend_playbook` MCP tool. Adding a tool = one entry here + a fixture
# under tests/fixtures/. Detection and playbook assembly live in recommend.py; this file
# only references the closed vocabulary of predicates defined there.
#
# Bump `rules_version` whenever tools are added; give each new tool `since: <that version>`
# so repos already on an older recommendation are only asked about what is new.

rules_version: 1

# User-facing preferences. `choice` prefs pick one tool among several; `bool` prefs turn an
# optional tool on or off. A pref is only asked when the repo does not already settle it.
prefs:
  formatter:
    language: python
    type: choice
    choices: [ruff, black]
    default: ruff
    question: "Which Python formatter should the playbook check?"
  dead_code:
    language: python
    type: bool
    default: false
    question: "Add vulture dead-code detection (informational)?"
  types:
    language: python
    type: bool
    default: true
    question: "Add pyrefly type checking?"
  security:
    language: python
    type: bool
    default: true
    question: "Add pyspector security scanning?"

# How each language/package manager prepares the environment and runs tools.
#   image     playbook `settings.image` (used by remote runs)
#   install   commands for the `install` section (`install_nolock` when no lockfile exists)
#   run       prefix for tools that live in the project environment
#   exec      prefix for tools fetched on demand (python-tool kind uses `--from`)
profiles:
  python:
    uv:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
      install: ["uv sync --all-groups"]
      run: "uv run "
      tool: "uvx --from {package}=={version} "
    pip:
      image: python:3.12-slim
      install: ["python -m venv .venv"]
      project_install:
        requirements: ".venv/bin/pip install -r requirements.txt"
        project: ".venv/bin/pip install ."
      run: ".venv/bin/"
      tool: ".venv/bin/"
      tool_install: ".venv/bin/pip install {package}=={version}"
  node:
    npm:
      image: node:22-slim
      install: ["npm ci"]
      install_nolock: ["npm install"]
      run: "npx --no-install "
      pm: "npm"
    pnpm:
      image: node:22-slim
      install: ["corepack pnpm install --frozen-lockfile"]
      install_nolock: ["corepack pnpm install"]
      run: "corepack pnpm exec "
      pm: "corepack pnpm"
    yarn:
      image: node:22-slim
      install: ["corepack yarn install --immutable"]
      install_nolock: ["corepack yarn install"]
      run: "corepack yarn "
      pm: "corepack yarn"
    bun:
      image: oven/bun:1
      install: ["bun install --frozen-lockfile"]
      install_nolock: ["bun install"]
      run: "bunx --bun "
      pm: "bun"
  go:
    go:
      image: golang:1.24
      install: ["go mod download"]
      run: ""
  java:
    maven:
      image: maven:3.9-eclipse-temurin-21
      install: []
      run: ""
    gradle:
      image: gradle:8-jdk21
      install: []
      run: ""
  csharp:
    dotnet:
      image: mcr.microsoft.com/dotnet/sdk:9.0
      install: ["dotnet restore"]
      run: ""

# Tool entries.
#   language / category   category is one of lint|format|types|unit|security
#   kind                  python-tool (fetched on demand, `package`+`version`), or project
#                         (runs in the project environment)
#   when                  AND of predicates: has_file, has_dir, has_dep, pkg_script, manager
#   configured_by         tokens that mean "the repo already uses this tool":
#                         file:<glob>, pyproject:<dotted.path>, dep:<name>
#   pref                  `name` (bool pref must be true) or `{name: value}` (choice pref)
#   blocking_if_present   when the repo already uses the tool, a failure fails the playbook
#   command               string, or a map keyed by manager (with `default`)
#   severity              0-5 passed to setSeverity
tools:
  # ---------------------------------------------------------------- python
  - id: ruff_check
    language: python
    category: lint
    kind: python-tool
    package: ruff
    version: "0.17.0"
    command: "ruff check --output-format=json ."
    configured_by: ["pyproject:tool.ruff", "file:ruff.toml", "file:.ruff.toml"]
    blocking_if_present: true
    severity: 2
    since: 1
    why: "Fast linter; JSON output lets Satori turn hits into findings."

  - id: ruff_format
    language: python
    category: format
    kind: python-tool
    package: ruff
    version: "0.17.0"
    command: "ruff format --check ."
    pref: { formatter: ruff }
    configured_by: ["pyproject:tool.ruff.format"]
    blocking_if_present: true
    severity: 1
    since: 1
    why: "Formatting drift check with ruff (chosen formatter)."

  - id: black_check
    language: python
    category: format
    kind: python-tool
    package: black
    version: "26.10.1"
    command: "black --check ."
    pref: { formatter: black }
    configured_by: ["pyproject:tool.black"]
    blocking_if_present: true
    severity: 1
    since: 1
    why: "Formatting drift check with black (chosen formatter)."

  - id: pytest
    language: python
    category: unit
    kind: project
    package: pytest
    version: "9.1.1"
    command: "pytest -q"
    when: { has_any: [{ has_dir: tests }, { has_dir: test }, { has_file: "pytest.ini" }, { has_file: "conftest.py" }] }
    configured_by: ["pyproject:tool.pytest", "file:pytest.ini", "dep:pytest"]
    blocking_if_present: true
    severity: 3
    since: 1
    why: "Runs the unit test suite."

  - id: pyrefly
    language: python
    category: types
    kind: python-tool
    package: pyrefly
    version: "1.3.2"
    command: "pyrefly check"
    pref: types
    configured_by: ["pyproject:tool.pyrefly", "file:pyrefly.toml"]
    blocking_if_present: true
    severity: 2
    since: 1
    why: "Static type checking."

  - id: pyspector
    language: python
    category: security
    kind: python-tool
    package: pyspector
    version: "0.2.2"
    command: "pyspector scan . -f json"
    pref: security
    configured_by: ["dep:pyspector"]
    blocking_if_present: false
    severity: 4
    since: 1
    why: "Python SAST; JSON output is parsed into TOOL findings."

  - id: vulture
    language: python
    category: lint
    kind: python-tool
    package: vulture
    version: "2.16"
    command: "vulture ."
    pref: dead_code
    configured_by: ["pyproject:tool.vulture", "dep:vulture"]
    blocking_if_present: false
    severity: 1
    since: 1
    why: "Dead code detection, informational (many false positives)."

  # ------------------------------------------------------------ javascript
  - id: eslint
    language: node
    category: lint
    kind: project
    command: "eslint -f json ."
    when: { has_any: [{ has_file: "eslint.config.*" }, { has_file: ".eslintrc*" }, { has_dep: eslint }] }
    configured_by: ["file:eslint.config.*", "file:.eslintrc*", "dep:eslint"]
    blocking_if_present: true
    severity: 2
    since: 1
    why: "Lint with the repo's own ESLint setup; JSON output feeds findings."

  - id: prettier
    language: node
    category: format
    kind: project
    command: "prettier --check ."
    when: { has_any: [{ has_file: ".prettierrc*" }, { has_file: "prettier.config.*" }, { has_dep: prettier }] }
    configured_by: ["file:.prettierrc*", "file:prettier.config.*", "dep:prettier"]
    blocking_if_present: true
    severity: 1
    since: 1
    why: "Formatting drift check with the repo's Prettier setup."

  - id: tsc
    language: node
    category: types
    kind: project
    command: "tsc --noEmit"
    when: { has_file: "tsconfig.json" }
    configured_by: ["file:tsconfig.json"]
    blocking_if_present: true
    severity: 2
    since: 1
    why: "TypeScript type check without emitting files."

  - id: node_tests
    language: node
    category: unit
    kind: project
    command: "{pm} run test"
    when: { pkg_script: test }
    configured_by: ["file:package.json"]
    blocking_if_present: true
    severity: 3
    since: 1
    why: "Runs the repo's own `test` script."

  - id: node_audit
    language: node
    category: security
    kind: project
    command:
      npm: "npm audit --json"
      pnpm: "corepack pnpm audit --json"
      yarn: "corepack yarn npm audit --json"
      default: ""
    configured_by: []
    blocking_if_present: false
    severity: 4
    since: 1
    why: "Known-vulnerable dependencies; JSON output is parsed into findings."

  # -------------------------------------------------------------------- go
  - id: go_vet
    language: go
    category: lint
    kind: project
    command: "go vet ./..."
    configured_by: []
    blocking_if_present: true
    severity: 2
    since: 1
    why: "Built-in static checks."

  - id: gofmt
    language: go
    category: format
    kind: project
    command: 'test -z "$(gofmt -l .)"'
    configured_by: []
    blocking_if_present: true
    severity: 1
    since: 1
    why: "Fails if any file is not gofmt-formatted."

  - id: go_test
    language: go
    category: unit
    kind: project
    command: "go test ./..."
    configured_by: []
    blocking_if_present: true
    severity: 3
    since: 1
    why: "Runs the unit tests."

  - id: govulncheck
    language: go
    category: security
    kind: project
    command: "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format json ./..."
    configured_by: []
    blocking_if_present: false
    severity: 4
    since: 1
    why: "Known vulnerabilities reachable from your code."

  # ------------------------------------------------------------------ java
  - id: maven_test
    language: java
    category: unit
    kind: project
    command: "mvn -B -ntp test"
    when: { manager: [maven] }
    configured_by: []
    blocking_if_present: true
    severity: 3
    since: 1
    why: "Compiles and runs the unit tests."

  - id: gradle_test
    language: java
    category: unit
    kind: project
    command: "gradle test --no-daemon"
    when: { manager: [gradle] }
    configured_by: []
    blocking_if_present: true
    severity: 3
    since: 1
    why: "Compiles and runs the unit tests."

  # ---------------------------------------------------------------- csharp
  - id: dotnet_build
    language: csharp
    category: lint
    kind: project
    command: "dotnet build --no-restore -warnaserror"
    configured_by: []
    blocking_if_present: true
    severity: 2
    since: 1
    why: "Build with warnings as errors."

  - id: dotnet_format
    language: csharp
    category: format
    kind: project
    command: "dotnet format --verify-no-changes --no-restore"
    configured_by: ["file:.editorconfig"]
    blocking_if_present: true
    severity: 1
    since: 1
    why: "Formatting drift check."

  - id: dotnet_test
    language: csharp
    category: unit
    kind: project
    command: "dotnet test --no-restore"
    configured_by: []
    blocking_if_present: true
    severity: 3
    since: 1
    why: "Runs the unit tests."

  - id: dotnet_vulnerable
    language: csharp
    category: security
    kind: project
    command: "dotnet list package --vulnerable --include-transitive"
    configured_by: []
    blocking_if_present: false
    severity: 4
    since: 1
    why: "Known-vulnerable NuGet packages."

  # ------------------------------------------------------------ dockerfile
  # Cross-cutting: applies to any repo with a Dockerfile, but only where a Python
  # toolchain is part of the profile (checkov is fetched with uvx / pip).
  - id: checkov_dockerfile
    language: dockerfile
    category: security
    kind: python-tool
    package: checkov
    version: "3.3.29"
    command: "checkov -d . --framework dockerfile -o json"
    when: { has_file: "Dockerfile*" }
    configured_by: []
    blocking_if_present: false
    severity: 3
    since: 1
    why: "Dockerfile misconfiguration scan; JSON output feeds findings."
