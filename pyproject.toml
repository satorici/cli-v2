[project]
name = "satori-cli"
version = "0.1.0"
authors = [{ name = "Satori CI", email = "info@satori.ci" }]
dependencies = [
    "httpx2>=2.5.0",
    "rich>=13.7.1",
    "click>=8.2.0",
    "rich-click>=1.8.3",
    "deepmerge>=2.0",
    "pyyaml>=6.0.2",
    "msgpack>=1.1.0",
    "repro-zipfile>=0.4.0",
    "click-option-group>=0.5.8",
    "paramiko>=4.0.0",
    "numpy>=2.0",
    "netaddr>=1.3.0",
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
satori-v2 = "satori_cli:main"

[dependency-groups]
dev = [
    "ruff>=0.9.7",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyrefly]

[tool.hatch.build.targets.wheel]
packages = ["src/satori_cli"]
